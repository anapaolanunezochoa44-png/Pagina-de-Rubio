<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandera del Municipio Junín - Rubio, Táchira</title>
    <!-- Tailwind CSS para diseño moderno y utilidades -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css_simbolos/Escudo.css">
    <link rel="stylesheet" href="css_simbolos/audios.css">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <header>
        <h1 class="text-3xl font-bold tracking-wide text-amber-400">Bandera del Municipio Junín, Estado Táchira</h1>
        
        <audio id="audioFondo" src="audios_simbolos/Aires_de_la_Cordillera.mp3" preload="auto" loop></audio>

<button id="btnAudio" class="audio-control" aria-label="Controlar audio">
    <svg id="iconoSonido" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
    <svg id="iconoMudo" class="oculto" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
</button>
    </header>
    <div class="text-center mb-6">
        
        <p class="text-sm text-slate-300 mt-1">Se ha Estado utilizando desde 1975, original de Gonzalo Fuentes Lacruz, <br>la cual está formada por tres colores
        unidos en franzas horizontales.</p>
    </div>


    <div class="escudo-container relative w-full  mx-auto">

    <div class="absolute" style="top: 0%; left: 0%; width: 100%; height: 80%; z-index: 5;">
        
        <div class="pieza-escudo absolute" style="top: 0%; left: 0%; width: 50%; height: 50%;" onclick="abrirModal('El Color Negro:', 'Está Franja llevará el Escudo de Armas del Municipio, representando la riqueza petrolera que afloró en Venezuela por primera vez en estas tierras.')">
            <img src="Bandera/Parte negra.png" alt="Franja Negra" class="w-full h-full object-fill drop-shadow">
        </div>

        <div class="pieza-escudo absolute" style="top: 0%; left: 50%; width: 50%; height: 50%;" onclick="abrirModal('El Color Blanco:', 'Está Franja representa la prístina pureza del aura del pueblo que revive en cada amenecer, que empuja nuestra gente a cumplir con hidalguía la máxima consigna de Junín, -La Sultana del Trabajo- este blanc representa también la flor de los frutos de los cafetos que nos enamora con su belleza y su aroma para luego darnos la riqueza de sus frutos, que nos distingue en el mundo entero, pero además representa el manto de la inmaculada.')">
            <img src="Bandera/parte blanca.png" alt="Franja Blanca" class="w-full h-full object-fill drop-shadow">
        </div>

        <div class="pieza-escudo absolute" style="top: 50%; left: 0%; width: 100%; height: 50%;" onclick="abrirModal('El Color Rojo', 'Esta Franja inferior representa la pasión por el trabajo, por la vida, pór el sugir de la gente, así como la sangre preciosa y aún presente de nuestro héroes comuneros antirealistas y en epocas recientes la de nuestro querido Leonardo Ruiz Pineda, por no claudicar a sus ideales de servicip y amor por nuestro pueblo y su gente.')">
            <img src="Bandera/Parte Roja.png" alt="Franja Roja" class="w-full h-full object-fill drop-shadow">
        </div>
    </div>

    </div>

    <!-- VENTANA MODAL (Diseño flotante elegante) -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-transform scale-95" id="modal-content">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 id="modal-titulo" class="text-xl font-bold text-amber-400">Título</h3>
                <button onclick="cerrarModal()" class="text-slate-400 hover:text-white text-2xl font-bold px-2">&times;</button>
            </div>
            <p id="modal-texto" class="text-slate-300 text-sm leading-relaxed mb-6">Descripción detallada...</p>
            <div class="flex justify-end">
                <button onclick="cerrarModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-5 py-2 rounded-lg text-sm transition-colors">Entendido</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICACIÓN SIMPLE (Toast mejorado) -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 border-2 border-amber-500 text-slate-100 px-5 py-4 rounded-2xl shadow-2xl hidden transition-all z-50 max-w-md text-sm leading-relaxed">
        <span id="toast-texto">Mensaje informativo</span>
    </div>

    <!-- SCRIPT DE INTERACTIVIDAD -->
    <script src="js_simbolos/Escudo.js"></script>
    <script src="js_simbolos/audios.js"></script>
</body>
</html>
