<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escudo de Armas de la Ciudad - Rubio, Táchira</title>
    <!-- Tailwind CSS para diseño moderno y utilidades -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css_simbolos/Escudo.css">
    <link rel="stylesheet" href="css_simbolos/audios.css">

</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
<header>
    <h1 class="text-3xl font-bold tracking-wide text-amber-400">Escudo de Armas de la Ciudad</h1>

    <audio id="audioFondo" src="audios_simbolos/Aires_de_la_Cordillera.mp3" preload="auto" loop></audio>
    <button id="btnAudio" class="audio-control" aria-label="Controlar audio">
    <svg id="iconoSonido" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
    <svg id="iconoMudo" class="oculto" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
</button>
</header>
    <div class="text-center mb-6">
        
        <p class="text-sm text-slate-300 mt-1">Municipio Junín, Estado Táchira</p>
        <p class="text-sx text-slate-300 mt-1">Cuya autoridad corresponde a Rafael M. Rosales y Aurelio Ferrero Tamayo, <br>que lleva en suscampos los colores de la bandera Nacional en tres cuarteles:</p>
    </div>

<div class="escudo-container relative w-full max-w-[500px] h-[650px] mx-auto">

    <div class="pieza-simple absolute" style="top: 6%; left: -29%; width: 90.5%; z-index: 2;" onclick="mostrarInfoSimple('Rama de Café', 'Simboliza el café, fruto emblemático que impulsó la economía histórica del Municipio.')">
        <img src="Escudo/rama de café.png" alt="Rama de Café" class="w-full h-auto">
    </div>

    <div class="pieza-simple absolute" style="top: 3%; right: -32%; width: 89%; z-index: 1;" onclick="mostrarInfoSimple('Rama de Maíz', 'Representa la riqueza agrícola tradicional.')">
        <img src="Escudo/hoja de maiz.png" alt="Rama de Maíz" class="w-full h-auto">
    </div>

    <div class="pieza-simple absolute" style="top: -1%; left: 18.5%; width: 69%; z-index: 10;" onclick="mostrarInfoSimple('Corona Mural', 'Que es el timbre de este escudo.')">
        <img src="Escudo/corona.png" alt="Corona Mural" class="w-full h-auto drop-shadow-md">
    </div>

    <div class="absolute" style="top: 18.5%; left: 20%; width: 65%; height: 54%; z-index: 5;">
        
        <div class="pieza-escudo absolute" style="top: 0%; left: 0%; width: 50%; height: 50%;" onclick="abrirModal('Cuartel Superior Derecho: Color amarrillo', 'Posee la figura de Don Gervasio Rubio, como testimonio a quien favoresiera el nacimiento de la ciudad capital del municipio.')">
            <img src="Escudo/cuartel amarrillo.png" alt="Cuartel Amarillo" class="w-full h-full object-fill drop-shadow">
        </div>

        <div class="pieza-escudo absolute" style="top: 0%; left: 50%; width: 50%; height: 50%;" onclick="abrirModal('Cuartel Superior Izquierdo: Color Rojo', 'Contiene en él una mano que se encuentra sobre una torre almenada, símbolo de Santa Bárbara, Patrona Espiritual de Rubio.')">
            <img src="Escudo/cuartel rojo.png" alt="Cuartel Rojo" class="w-full h-full object-fill drop-shadow">
        </div>

        <div class="pieza-escudo absolute" style="top: 50%; left: -1%; width: 101.4%; height: 60%;" onclick="abrirModal('Cuartel Inferior', 'Es el de mayor tamaño, y tiene en él un puente azul ligeramente arqueado (Que es el Puente Miranda o Azul) y las ondas de un río, que justifican la tradicción póntalidad de la ciudad y de la quebrada Capacha.')">
            <img src="Escudo/Cuartel azul.png" alt="Cuartel Azul" class="w-full h-full object-fill drop-shadow">
        </div>
    </div>

    <div class="absolute" style="bottom: 4%; left: -2%; width: 106%; z-index: 15; top: 78%">
        <img src="Escudo/banderin.png" alt="Armas de la Ciudad" class="w-full h-auto drop-shadow-lg">
        
        <div class="absolute cursor-pointer hover:bg-yellow-400/20 rounded transition-all" style="bottom: 15%; left: 8%; width: 35%; height: 60%;" onclick="abrirModal('09 de diciembre de 1794', 'Fecha en la que se designa la fundación de la ciudad capital del municipio')" title="Clic para ver detalles"></div>
        
        <div class="absolute cursor-pointer hover:bg-yellow-400/20 rounded transition-all" style="bottom: 15%; right: 8%; width: 35%; height: 60%;" onclick="abrirModal('09 de junio de 1855', 'Fecha en la que es creado oficialmente el Municipio Rubio, que más tarde pasaría a ser Municipio Junín como se le conoce actualmente')" title="Clic para ver detalles"></div>
    </div>

</div>

    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-transform scale-95" id="modal-content">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 id="modal-titulo" class="text-xl font-bold text-amber-400">Título</h3>
                <button onclick="cerrarModal()" class="text-slate-400 hover:text-white text-2xl font-bold px-2">&times;</button>
            </div>
            <p id="modal-texto" class="text-slate-300 text-sm leading-relaxed mb-6">Descripción detallada...</p>
            <div class="flex justify-end">
                <button onclick="cerrarModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-5 py-2 rounded-lg text-sm transition-colors">Entendido</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICACIÓN SIMPLE (Para ramas y corona - Letra más grande y legible) -->
<div id="toast" class="fixed bottom-6 right-6 bg-slate-800 border-2 border-amber-500 text-slate-100 px-8 py-7 rounded-2xl shadow-2xl hidden transition-all z-50 max-w-md text-sm leading-relaxed">
    <span id="toast-texto">Mensaje informativo</span>
</div>

    <!-- SCRIPT DE INTERACTIVIDAD -->
    <script src="js_simbolos/Escudo.js"></script>
    <script src="js_simbolos/audios.js"></script>
</body>
</html>
